name: CIF library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install pinned official MoonBit release
        run: bash scripts/setup-ci.sh
      - name: Resolve pinned public dependencies
        run: moon update
      - name: Runtime and source identity
        run: |
          node --version
          moon version --all
          git rev-parse HEAD
      - run: moon check --deny-warn --target js
      - run: moon build --deny-warn --target js
      - run: moon test --deny-warn --target js
      - run: moon check --deny-warn --target wasm-gc
      - run: moon build --deny-warn --target wasm-gc
      - run: moon test --deny-warn --target wasm-gc
      - name: Consumer bridge
        working-directory: examples/lunar
        run: |
          moon run . --target js
          moon run . --target wasm-gc
      - name: Batch consumer bridge
        working-directory: examples/lunar-batch
        run: |
          moon run . --target js
          moon run . --target wasm-gc
      - run: moon fmt && moon info && git diff --exit-code
      - name: Selective row consumer
        working-directory: examples/lunar-selective
        run: |
          moon run . --target js
          moon run . --target wasm-gc
      - name: Annotated calculation consumer
        working-directory: examples/lunar-annotated
        run: |
          moon run . --target js
          moon run . --target wasm-gc
      - name: Append row external Lunar recipient
        working-directory: examples/append-row
        run: node verify.mjs
      - name: Local file workflow
        working-directory: examples/file-workflow
        run: |
          moon run . --target js -- catalog sample.cif
          moon run . --target js -- query sample.cif scope.json
          mkdir -p work
          moon run . --target js -- preview sample.cif sample-plan.json > work/sample.preview.json
          node review-preview.mjs work/sample.preview.json work/sample.review.html --source sample.cif
          expected_result_sha=$(node -p "JSON.parse(require('node:fs').readFileSync('work/sample.preview.json', 'utf8')).planned.sha256")
          moon run . --target js -- apply sample.cif sample-plan.json work/sample.output.cif --expect-result-sha256 "$expected_result_sha"
          moon run . --target js -- query work/sample.output.cif scope.json > work/sample.query.json
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const forecast = JSON.parse(fs.readFileSync('work/sample.preview.json', 'utf8'));
          const query = JSON.parse(fs.readFileSync('work/sample.query.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync('sample-plan.json', 'utf8'));
          const digest = name => createHash('sha256').update(fs.readFileSync(name)).digest('hex');
          assert.equal(digest('sample.cif'), plan.sourceSha256);
          assert.equal(digest('work/sample.output.cif'), forecast.planned.sha256);
          assert.equal(query.sourceSha256, forecast.planned.sha256);
          assert.deepEqual(query.rows.map(row => row.map(cell => cell.value)), [
            ['A', '1.200(5)', 'keep A'],
            ['B', '4.200(60)', 'processed B'],
            ['C', '?', 'keep C'],
            ['D', '6.660(80)', '?'],
          ]);
          assert.equal(query.rows[3][2].kind, 'string');
          NODE
      - name: File output preservation contracts
        working-directory: examples/file-workflow
        run: node tests/output-preservation.mjs
      - name: Saved preview consumer contracts
        working-directory: examples/file-workflow
        run: node tests/saved-preview.mjs
      - name: Review physical lines in actual Chromium
        working-directory: examples/file-workflow
        env:
          CIF_REVIEW_EVIDENCE: work/review-browser-ci
        run: node tests/review-browser.mjs
      - name: Preserve review browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-${{ github.sha }}
          if-no-files-found: error
          path: |
            examples/file-workflow/work/review-browser-ci/RESULT.json
            examples/file-workflow/work/review-browser-ci/browser-observer.js
            examples/file-workflow/work/review-browser-ci/logs/*
            examples/file-workflow/work/review-browser-ci/cli-build/**/*.js
            examples/file-workflow/work/review-browser-ci/cases/*/*.cif
            examples/file-workflow/work/review-browser-ci/cases/*/*.json
            examples/file-workflow/work/review-browser-ci/cases/*/*.html
            examples/file-workflow/work/review-browser-ci/cases/*/*.png
      - name: File plan target validation contracts
        working-directory: examples/file-workflow
        run: node tests/plan-targets.mjs
      - name: Catalog discovery consumer chain
        working-directory: examples/file-workflow
        run: node tests/catalog-consumer.mjs
      - name: Append arbitrary file and external Lunar receiver
        working-directory: examples/file-workflow
        run: node tests/append-file.mjs
      - name: Curated row removal and external Lunar receiver
        working-directory: examples/curate-loop
        run: node verify.mjs
      - name: Missing Pair provenance and external Lunar receiver
        working-directory: examples/provenance-pair
        run: node verify.mjs
